refresh:
  name: Refresh Sentrymo data
  description: Request an immediate authorized Sentrymo snapshot refresh.
  fields:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID. When omitted, all Sentrymo entries are refreshed.
      required: false
      selector:
        text:

set_protection_mode:
  name: Set protection mode
  description: Request a Sentrymo vehicle protection-mode change using the CPIN stored during pairing. An accepted response acknowledges the request but is not a physical-execution guarantee.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: Sentrymo vehicle ID.
      required: true
      selector:
        text:
    mode:
      name: Mode
      description: Requested protection mode.
      required: true
      selector:
        select:
          options:
            - disabled
            - manual
            - automatic
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
      selector:
        text:

set_immobilizer:
  name: Set immobilizer
  description: Queue an immobilizer output request using the CPIN stored during pairing. Queued does not mean physically completed.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: Sentrymo vehicle ID.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: Requested immobilizer output state.
      required: true
      selector:
        boolean:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
      selector:
        text:

set_accessory:
  name: Set accessory
  description: Queue an accessory output request using the CPIN stored during pairing. Queued does not mean physically completed.
  fields:
    vehicle_id:
      name: Vehicle ID
      description: Sentrymo vehicle ID.
      required: true
      selector:
        text:
    enabled:
      name: Enabled
      description: Requested accessory output state.
      required: true
      selector:
        boolean:
    entry_id:
      name: Entry ID
      description: Optional Home Assistant config entry ID.
      required: false
      selector:
        text:
