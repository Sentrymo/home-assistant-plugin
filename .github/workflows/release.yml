name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    name: Publish Home Assistant integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate tag and manifest version
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python3 -c 'import json; print(json.load(open("custom_components/sentrymo/manifest.json", encoding="utf-8"))["version"])')"
          test "${GITHUB_REF_NAME}" = "${manifest_version}"

      - name: Build release archive
        shell: bash
        run: zip -r sentrymo.zip custom_components/sentrymo

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" sentrymo.zip \
            --verify-tag \
            --generate-notes \
            --title "Sentrymo ${GITHUB_REF_NAME}"
