name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  # Release without pushing a tag: tags the target with the manifest version.
  workflow_dispatch:
    inputs:
      target:
        description: Branch or commit to release
        default: main
        required: true
      notes:
        description: Release notes (Markdown); generated notes are appended
        required: false

permissions:
  contents: write

jobs:
  runner:
    uses: ./.github/workflows/select-runner.yml
    secrets: inherit
    permissions:
      contents: read

  release:
    name: Publish Home Assistant integration (${{ needs.runner.outputs.tier }})
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.runs-on) }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.target || github.ref }}

      - name: Check runner prerequisites
        shell: bash
        run: |
          for tool in python3 zip gh; do
            command -v "${tool}" >/dev/null || { echo "::error::${tool} is missing on runner ${RUNNER_NAME}"; exit 1; }
          done

      - name: Validate tag and manifest version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          manifest_version="$(python3 -c 'import json; print(json.load(open("custom_components/sentrymo/manifest.json", encoding="utf-8"))["version"])')"
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            test "${GITHUB_REF_NAME}" = "${manifest_version}"
          elif gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${manifest_version}" >/dev/null 2>&1; then
            echo "::error::Tag ${manifest_version} already exists; bump the manifest version first"
            exit 1
          fi
          echo "tag=${manifest_version}" >> "$GITHUB_OUTPUT"

      - name: Build release archive
        shell: bash
        run: zip -r sentrymo.zip custom_components/sentrymo

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES: ${{ inputs.notes }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--generate-notes --title "Sentrymo ${TAG}")
          if [[ "${GITHUB_REF_TYPE}" == tag ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$(git rev-parse HEAD)")
          fi
          if [[ -n "${NOTES}" ]]; then
            args+=(--notes "${NOTES}")
          fi
          gh release create "${TAG}" sentrymo.zip "${args[@]}"
